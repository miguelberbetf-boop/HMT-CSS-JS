<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hierarquia de titulos</title>
</head>
<body>
    <h1>O elemento &lt;h1&gt; representa o titulo principal e deve ser utilizado uma vez por pagina</h1>
    <h2>Os elementos &lt;h2&gt; até o &lt;h6&gt; são subtitulos </h2>
    <p>Não se deve ulizar h1 mais de uma vez.Sendo fundamental seguir a ordem correta de titulos e subseções
        para manter a organização e a visibilidade da sua pagina
    </p>
</body>
</html>
